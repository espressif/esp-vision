# Hardware-in-the-loop tests: flash a firmware build onto the board attached to
# the tagged runner and test it. See tools/ci/flash_and_test.py.
#
# Runner: docker executor. mise installs Node 22; the image supplies
# Python, pyserial and esptool. The runner must
# pass the board's serial device into the container. With more than one board
# attached, pin ESPPORT per job; otherwise the port is auto-detected.

.target_test_base:
  stage: target_test
  extends: .rules:test:target
  image: $CI_REGISTRY/ci/images/idf-v6.2-target-test:2
  variables:
    ESPBAUD: "460800"
  timeout: 20 minutes
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - |
      echo "Setting PATH"
      DIR="$HOME/.local/bin/"

      case ":$PATH:" in
          *":$DIR:"*) ;;
          *) PATH="$DIR:$PATH" ;;
      esac

      export PATH
    - export TMPDIR="$CI_PROJECT_DIR/.cache/tmp" TMP="$CI_PROJECT_DIR/.cache/tmp" TEMP="$CI_PROJECT_DIR/.cache/tmp"
    - mkdir -p "$TMPDIR"
    - curl -fsSL https://mise.run | sh
    - mise install node@22
    - eval "$(mise env --shell bash node@22)"
    - node --version
    - python3 -c "import esptool, serial; print('esptool', esptool.__version__, '/ pyserial', serial.__version__)"
  script:
    # Exists up front so a failure before the capture still uploads something.
    - mkdir -p logs
    - |
      python3 tools/ci/flash_and_test.py --board "$BOARD" \
        --checks identity,memory,camera,framesizes,pixformats,orientation,ipa_stats,snapshot_rate,preview,image_ops,display,display_stream,camera_display_lifecycle,image_copy_to_fb,image_transform_argument,sensor_snapshot_buffer,memory_policy,espdl_inference \
        --require-all \
        --log "logs/$BOARD-$IDF_LABEL-target-test.log" \
        --output "logs/$BOARD-$IDF_LABEL-frame.jpg" \
        --screen-output "logs/$BOARD-$IDF_LABEL-screen.jpg"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - logs/

# Test the same pinned IDF image used for P4 release firmware. `needs` cannot
# expand variables, so keep its literal job name aligned with the build matrix.
.target_test_p4x_function_ev_board:
  extends: .target_test_base
  tags:
    - esp32p4x_function_ev_board
  resource_group: esp32p4x_function_ev_board
  variables:
    BOARD: ESP32_P4X_FUNCTION_EV_BOARD

target_test_p4x_function_ev_board_idf5.5.6:
  extends: .target_test_p4x_function_ev_board
  needs:
    - job: "firmware: [v5.5.6, ESP32_P4X_FUNCTION_EV_BOARD]"
      artifacts: true
  variables:
    IDF_LABEL: idf5.5.6

.target_test_p4x_vision:
  extends: .target_test_base
  tags:
    - vision_p4x
  resource_group: vision_p4x
  variables:
    BOARD: ESP32_P4X_VISION
  # SC101IOT DVP has no IPA statistics API; this board has no LCD backend.
  # Keep the supported checks strict and omit screen capture entirely.
  script:
    - mkdir -p logs
    - |
      python3 tools/ci/flash_and_test.py --board "$BOARD" \
        --checks identity,memory,camera,framesizes,pixformats,orientation,snapshot_rate,preview,image_ops,image_copy_to_fb,image_transform_argument,sensor_snapshot_buffer,memory_policy,espdl_inference \
        --require-all \
        --log "logs/$BOARD-$IDF_LABEL-target-test.log" \
        --output "logs/$BOARD-$IDF_LABEL-frame.jpg"

target_test_p4x_vision_idf5.5.6:
  extends: .target_test_p4x_vision
  needs:
    - job: "firmware: [v5.5.6, ESP32_P4X_VISION]"
      artifacts: true
  variables:
    IDF_LABEL: idf5.5.6

.target_test_s31_korvo:
  extends: .target_test_base
  tags:
    - esp32s31-korvo-1_1
  resource_group: esp32s31-korvo-1_1
  variables:
    BOARD: ESP32_S31_KORVO
  # DVP camera and LCD acceptance; IPA statistics are not available on Korvo.
  script:
    - ': "${ESPPORT:?Configure ESPPORT for the Korvo runner UART device}"'
    - mkdir -p logs
    - |
      python3 tools/ci/flash_and_test.py --board "$BOARD" --port "$ESPPORT" --role uart \
        --checks identity,memory,camera,framesizes,pixformats,orientation,snapshot_rate,preview,image_ops,display,display_stream,camera_display_lifecycle,image_copy_to_fb,image_transform_argument,sensor_snapshot_buffer,memory_policy \
        --require-all \
        --log "logs/$BOARD-$IDF_LABEL-target-test.log" \
        --output "logs/$BOARD-$IDF_LABEL-frame.jpg" \
        --screen-output "logs/$BOARD-$IDF_LABEL-screen.jpg"

target_test_s31_korvo_idf6.1:
  extends: .target_test_s31_korvo
  needs:
    - job: "firmware: [release-v6.1, ESP32_S31_KORVO]"
      artifacts: true
  variables:
    IDF_LABEL: idf6.1
