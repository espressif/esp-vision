.docs_changes: &docs_changes
  - ".gitlab-ci.yml"
  - ".gitlab/ci/**/*"
  - "docs/**/*"
  - "stubs/**/*"
  - "example/**/*"
  - "modules/**/*"
  - "components/imlib/**/*"
  - "components/zxing/**/*"
  - "boards/**/*.cmake"
  - "boards/**/*.h"
  - "boards/**/manifest.py"
  - "boards/**/board_inisetup.py"
  - "micropython.cmake"
  - "overlay/micropython/**/*.c"
  - "overlay/micropython/**/*.h"
  - "overlay/micropython/**/*.cmake"
  - "tools/ci/mcp/**/*"
  - "host/knowledge-mcp/**/*"

# Paths that affect the compiled firmware. Editing only docs (docs/**, *.md,
# stubs/**, example/**, LICENSE, ...) must NOT trigger a firmware rebuild.
.firmware_changes: &firmware_changes
  - "idf_ext.py"
  - "micropython.cmake"
  - ".gitmodules"
  - ".gitlab-ci.yml"
  - ".gitlab/ci/rules.yml"
  - ".gitlab/ci/target_test.yml"
  - "platform/**/*"
  - "modules/**/*"
  - "components/**/*"
  - "boards/**/*"
  - "overlay/**/*"
  - "lib/**/*"
  - "models/**/*"
  - "tools/**/*"

.docs_source_changes: &docs_source_changes
  - "example/**/*"
  - "modules/**/*"
  - "components/imlib/**/*"
  - "components/zxing/**/*"
  - "boards/**/*.cmake"
  - "boards/**/*.h"
  - "boards/**/manifest.py"
  - "boards/**/board_inisetup.py"
  - "micropython.cmake"
  - "overlay/micropython/**/*.c"
  - "overlay/micropython/**/*.h"
  - "overlay/micropython/**/*.cmake"

.rules:docs:build:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs_changes

.rules:mcp:build:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v\d+\.\d+(\.\d+)?|\d{4}\.\d{1,2}\.\d{1,2})($|[-.])/'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs_changes

.rules:docs:impact:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs_source_changes

.rules:docs:preview:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *docs_changes

.rules:docs:production:
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# Firmware and SDK releases are independent. A Device Core tag only verifies
# its npm package; it never builds, flashes or publishes firmware.
#
# API/web SDK verification: ESP_VISION_DEVICE_CORE_ONLY=1.
# Final firmware matrix: ESP_VISION_BUILD_FIRMWARE=1 (omit TEST_BOARD).
# Targeted bin: ESP_VISION_TEST_BOARD + ESP_VISION_TEST_IDF_IMAGE.
#
# Use ordinary push changes against the previous commit, including master;
# compare new-branch and non-push pipelines to master explicitly because GitLab
# otherwise considers every path changed when there is no previous push.
.rules:build:firmware:
  rules:
    - if: '$ESP_VISION_DEVICE_CORE_ONLY == "1" || $CI_COMMIT_TAG =~ /^device-core-v/'
      when: never
    - if: '$ESP_VISION_TEST_BOARD && ($BOARD != $ESP_VISION_TEST_BOARD || $IDF_IMAGE != $ESP_VISION_TEST_IDF_IMAGE)'
      when: never
    - if: '$ESP_VISION_TEST_BOARD || $ESP_VISION_BUILD_FIRMWARE == "1"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *firmware_changes
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000"'
      changes: *firmware_changes
    - if: '$CI_COMMIT_BRANCH && ($CI_PIPELINE_SOURCE != "push" || $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000")'
      changes:
        compare_to: 'refs/heads/master'
        paths: *firmware_changes

# HIL consumes the same firmware matrix. Targeted-bin and SDK-only runs cannot
# enqueue HIL jobs whose literal firmware artifact dependencies were omitted.
.rules:test:target:
  rules:
    - if: '$ESP_VISION_DEVICE_CORE_ONLY == "1" || $CI_COMMIT_TAG =~ /^device-core-v/ || $ESP_VISION_TEST_BOARD'
      when: never
    - if: '$ESP_VISION_BUILD_FIRMWARE == "1"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *firmware_changes
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BEFORE_SHA != "0000000000000000000000000000000000000000"'
      changes: *firmware_changes
    - if: '$CI_COMMIT_BRANCH && ($CI_PIPELINE_SOURCE != "push" || $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000")'
      changes:
        compare_to: 'refs/heads/master'
        paths: *firmware_changes

# Launchpad release: only on release tags. Two accepted shapes:
#   * semantic version  -> v1.0, v1.2.3, v1.2.3-rc1
#   * calendar / date    -> 2026.06.16, 2026.6.16, 2026.06.16-1
# A new matching tag is the sole trigger for publishing binaries to
# dl.espressif.com; ordinary branch / MR pipelines never publish.
.rules:release:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^(v\d+\.\d+(\.\d+)?|\d{4}\.\d{1,2}\.\d{1,2})($|[-.])/'
