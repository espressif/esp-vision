DEFAULT:
  perform_check: yes
  allowed_licenses:
    - Apache-2.0
  license_for_new_files: Apache-2.0
  new_notice_c: |
    /*
     * SPDX-FileCopyrightText: {years} Espressif Systems (Shanghai) CO LTD
     *
     * SPDX-License-Identifier: {license}
     */
  new_notice_python: |
    # SPDX-FileCopyrightText: {years} Espressif Systems (Shanghai) CO LTD
    # SPDX-License-Identifier: {license}
  espressif_copyright: '{years} Espressif Systems (Shanghai) CO LTD'

ignore:
  perform_check: no
  include:
    - 'build/**/*'
    - 'dist/**/*'
    - 'components/imlib/**/*'
    - 'lib/micropython/**/*'
    - 'lib/ulab/**/*'
    - 'overlay/micropython/**/*'
    - 'vscode-extension/node_modules/**/*'
    - 'vscode-extension/out/**/*'
    - 'vscode-extension/package-lock.json'
    - 'vscode-extension/package.json'
    - 'vscode-extension/tsconfig.json'
    - 'vscode-extension/.vscode/**/*'
    - 'vscode-extension/.vscodeignore'
    - 'vscode-extension/README.md'
    - 'vscode-extension/*.vsix'
    - 'patches/**/*'
    - '**/*.patch'
    - 'tools/ci/check_copyright_ignore.txt'

# Device Core follows the project Apache-2.0 license; historical notices ship in NOTICE.
host_device_core:
  include:
    - 'host/device-core/**/*'
  allowed_licenses:
    - Apache-2.0
  license_for_new_files: Apache-2.0

# Device-side HIL fixtures retain the firmware test suite's Apache license.
host_device_core_fixtures:
  include:
    - 'host/device-core/tests/fixtures/*.py'
  allowed_licenses:
    - Apache-2.0
  license_for_new_files: Apache-2.0
