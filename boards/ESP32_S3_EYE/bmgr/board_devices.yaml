version: 1.0.0
devices:
  - name: display_lcd
    chip: st7789
    type: display_lcd
    sub_type: spi
    version: default
    init_skip: true
    config:
      mirror_x: false
      mirror_y: false
      swap_xy: false
      invert_color: true
      need_reset: true
      x_max: 240
      y_max: 240
      io_spi_config:
        cs_gpio_num: 44
        dc_gpio_num: 43
        spi_mode: 0
        pclk_hz: 80000000
        trans_queue_depth: 10
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      lcd_panel_config:
        reset_gpio_num: -1
        rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
        data_endian: LCD_RGB_DATA_ENDIAN_BIG
        bits_per_pixel: 16
        flags:
          reset_active_high: false
    peripherals:
      - name: spi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    init_skip: true
    config:
      default_percent: 0
    peripherals:
      - name: ledc_backlight

  - name: camera
    chip: ov2640
    type: custom
    version: 1.0.0
    init_skip: true
