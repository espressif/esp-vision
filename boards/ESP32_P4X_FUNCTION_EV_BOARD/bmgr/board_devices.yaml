version: 1.0.0
devices:
  - name: lcd_touch
    chip: gt911
    type: lcd_touch
    sub_type: i2c
    version: default
    init_skip: true
    dependencies:
      espressif/esp_lcd_touch_gt911: "1.2.0~3"
    config:
      io_i2c_config:
        lcd_cmd_bits: 16
        scl_speed_hz: 100000
        transaction_timeout_ms: 100  # ESP-IDF 6.1+; older IDF uses its driver timeout.
      touch_config:
        # esp_lcd_touch mirrors as max - coordinate; use the last pixel index.
        x_max: 1023
        y_max: 599
        rst_gpio_num: -1
        int_gpio_num: -1
        flags:
          mirror_x: true
          mirror_y: true
    peripherals:
      - name: i2c_camera
        # Board Manager uses 8-bit addresses (GT911 7-bit: 0x5D / 0x14).
        i2c_addr: [0xBA, 0x28]

  - name: display_lcd
    chip: ek79007
    type: display_lcd
    sub_type: dsi
    version: default
    init_skip: true
    dependencies:
      espressif/esp_lcd_ek79007: "^1.0.0"
    config:
      reset_gpio_num: 27
      rgb_ele_order: LCD_RGB_ELEMENT_ORDER_RGB
      data_endian: LCD_RGB_DATA_ENDIAN_LITTLE
      bits_per_pixel: 16
      reset_active_high: 0
      dbi_config:
        virtual_channel: 0
        lcd_cmd_bits: 8
        lcd_param_bits: 8
      dpi_config:
        virtual_channel: 0
        dpi_clk_src: MIPI_DSI_DPI_CLK_SRC_DEFAULT
        dpi_clock_freq_mhz: 48
        pixel_format: LCD_COLOR_PIXEL_FORMAT_RGB565
        in_color_format: LCD_COLOR_FMT_RGB565
        out_color_format: LCD_COLOR_FMT_RGB565
        num_fbs: 1
        flags:
          use_dma2d: false
          disable_lp: false
        video_timing:
          h_size: 1024
          v_size: 600
          hsync_back_porch: 120
          hsync_pulse_width: 10
          hsync_front_porch: 120
          vsync_back_porch: 20
          vsync_pulse_width: 1
          vsync_front_porch: 20
    peripherals:
      - name: ldo_mipi
      - name: dsi_display

  - name: lcd_brightness
    type: ledc_ctrl
    version: default
    init_skip: true
    peripherals:
      - name: ledc_backlight

  - name: camera
    type: camera
    sub_type: csi
    version: default
    init_skip: true
    config:
      csi_config:
        reset_io: -1
        pwdn_io: -1
        dont_init_ldo: true
    peripherals:
      - name: i2c_camera
        frequency: 100000
      - name: ldo_mipi
