spec:
  inputs:
    force_push_to_github:
      type: boolean
      default: false

---

stages:
  - check
  - build
  - target_test
  - build_docs
  - deploy
  - post_deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

variables:
  GIT_SUBMODULE_STRATEGY: none
  CI_PYTHON_IMAGE: "python:3.11"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PRE_COMMIT_HOME: "$CI_PROJECT_DIR/.cache/pre-commit"
  ESP_DOCS_BUILD_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.5:1-1"
  ESP_DOCS_DEPLOY_IMAGE: "$CI_DOCKER_REGISTRY/esp-idf-doc-env-v5.5"
  CI_FORCE_PUSH_TO_GITHUB: "$[[ inputs.force_push_to_github ]]"

include:
  - local: '.gitlab/ci/rules.yml'
  - local: '.gitlab/ci/device-core.yml'
  - local: '.gitlab/ci/host-tools.yml'
  - local: '.gitlab/ci/plugin.yml'
  - local: '.gitlab/ci/target_test.yml'
  - local: '.gitlab/ci/docs.yml'
  - local: '.gitlab/ci/deploy.yml'

pre_commit:
  stage: check
  tags:
    - build
  image: $CI_PYTHON_IMAGE
  cache:
    key:
      files:
        - .pre-commit-config.yaml
    paths:
      - .cache/pip/
      - .cache/pre-commit/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git
    - python -m pip install --upgrade pip
    - python -m pip install pre-commit
  script:
    - pre-commit run --all-files --show-diff-on-failure astyle_py
    - pre-commit run --all-files --show-diff-on-failure check-copyright

python_stubs:
  stage: check
  tags:
    - build
  image: $CI_PYTHON_IMAGE
  script:
    - python -m py_compile stubs/*.pyi
    - python -m py_compile idf_ext.py

evmux_host_checks:
  stage: check
  tags:
    - build
  image: python:3.11-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates git gcc libc6-dev libssl-dev
    - python -m pip install PyYAML
    - git submodule sync -- lib/micropython
    - git submodule update --init --depth 1 lib/micropython
  script:
    - python -m unittest discover -s tools/tests -p 'test_*.py' -v
    - python tools/ci/check_docs_format.py

# Catch board-config drift early: build config.toml's [website] region from the
# board configs without IDF/esptool (--dry-run). This exercises board_model and
# generate_launchpad on every pipeline, not just at tag release, so a broken
# board.json / imlib_config.h fails here instead of at publish time.
launchpad_config_check:
  stage: check
  tags:
    - build
  image: $CI_PYTHON_IMAGE
  script:
    - python -m pip install --upgrade rtoml pyyaml
    - python tools/ci/launchpad/generate_launchpad.py --dry-run "${CI_COMMIT_TAG:-v0.0.0-dev}"

# Build the MCP API knowledge pack from in-repo sources (stubs + targets +
# board_model + curated docs/examples) and validate it against the schema. Runs
# without submodules, so the MicroPython surface is skipped here (the full pack,
# incl. MicroPython, is produced by build_mcp_pack in the build_docs stage). This
# catches a broken stub / RST / schema on every pipeline, not just at release.
mcp_pack_check:
  stage: check
  tags:
    - build
  image: $CI_PYTHON_IMAGE
  script:
    - python -m pip install --upgrade jsonschema
    - python docs/gen_mcp.py "${CI_COMMIT_TAG:-v0.0.0-dev}" --dry-run --out mcp-pack.dry.json
    - python tools/ci/mcp/validate_schema.py mcp-pack.dry.json

# Dead-link check for markdown files (relative paths + web URLs). Network
# flakiness shouldn't block the pipeline, so only report 404s and allow failure.
check_readme_links:
  stage: check
  tags:
    - build
  image: $CI_PYTHON_IMAGE
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.md"
        - "tools/ci/check_readme_links.py"
  script:
    - python tools/ci/check_readme_links.py

.firmware_base:
  stage: build
  extends: .rules:build:firmware
  # Firmware consumes no npm artifacts; keep native build validation independent
  # of the internet-tagged Node runner queue. SDK checks still gate the pipeline.
  needs: [pre_commit, python_stubs, evmux_host_checks]
  tags:
    - build
  variables:
    # Cap ninja compile parallelism so the heavy ESP-DL + zxing C++ translation
    # units stay below the CI runner memory limit. ESP-IDF v6.0's idf.py dropped
    # IDF_PY_BUILD_JOBS and runs `ninja` with no -j, so we inject -j via a ninja
    # wrapper in before_script instead (see below). Raise once runner RAM allows.
    NINJA_MAX_JOBS: "2"
  image:
    name: espressif/idf:$IDF_IMAGE
    entrypoint: [""]
  before_script:
    - git submodule sync -- lib/micropython lib/ulab lib/zxing-cpp
    - git submodule update --init --depth 1 lib/micropython lib/ulab lib/zxing-cpp
    - git -C lib/micropython submodule sync -- lib/micropython-lib
    - git -C lib/micropython submodule update --init --depth 1 lib/micropython-lib
    - . /opt/esp/idf/export.sh
    # idf.py (esp. v6.0) invokes `ninja` with no job limit, so ESP-DL + zxing
    # compile at full core count and OOM the runner. Shadow ninja with a wrapper
    # that injects `-j $NINJA_MAX_JOBS`. This is resolved via PATH by idf.py on
    # every IDF version. The real ninja is captured by absolute path to avoid
    # recursion.
    - REAL_NINJA="$(command -v ninja)"
    - mkdir -p "$CI_PROJECT_DIR/.ci-bin"
    - printf '#!/bin/sh\nexec "%s" -j "%s" "$@"\n' "$REAL_NINJA" "${NINJA_MAX_JOBS:-2}" > "$CI_PROJECT_DIR/.ci-bin/ninja"
    - chmod +x "$CI_PROJECT_DIR/.ci-bin/ninja"
    - export PATH="$CI_PROJECT_DIR/.ci-bin:$PATH"
    - echo "ninja wrapper active -> $REAL_NINJA -j ${NINJA_MAX_JOBS:-2}"
  script:
    - idf.py --board "$BOARD" build
    - python tools/ci/launchpad/build_identity.py "$BOARD" "$CI_COMMIT_SHA"
  after_script:
    - |
      if [ -d "build/$BOARD" ]; then
        find "build/$BOARD" -path '*/log/idf_py_*_output_*' -type f ! -name '*.txt' | while IFS= read -r log; do
          mv "$log" "$log.txt"
        done
      fi
    - |
      if [ "$BOARD" = "ESP32_P4X_EYE" ]; then
        for app_elf in "build/$BOARD"/idf*/*.elf; do
          [ -f "$app_elf" ] || continue
          board_build="${app_elf%/*}"
          mkdir -p "$board_build/debug"
          for diagnostic in "$app_elf" "$board_build"/*.map "$board_build/sdkconfig"; do
            [ -f "$diagnostic" ] || continue
            cp "$diagnostic" "$board_build/debug/"
          done
        done
      fi
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/$BOARD/idf*/log/
      - build/$BOARD/idf*/bootloader/bootloader.bin
      - build/$BOARD/idf*/partition_table/partition-table.bin
      # Collect the top-level application image without hard-coding ESP-IDF's
      # project-derived filename (esp-vision.bin today, micropython.bin before
      # the rename). flash_args below remains the authority for which image is
      # consumed by the release packer.
      - build/$BOARD/idf*/*.bin
      # P4-EYE boot failures need symbols from the same CI image. Keep the
      # ELF, linker map, and effective configuration without requiring a
      # separate local firmware build.
      - build/$BOARD/idf*/debug/
      # flash_args lists the {offset, file} pairs consumed by `esptool merge-bin`
      # in the tag-release pack_launchpad job (see .gitlab/ci/deploy.yml). These
      # boards use a single factory app with no OTA, so flash_args references
      # only the three .bin files already collected above.
      - build/$BOARD/idf*/flash_args
      # flasher_args.json carries the same offsets plus the chip and reset
      # behaviour; the hardware test jobs flash straight from it.
      - build/$BOARD/idf*/flasher_args.json
      # Release metadata binds the published tag to this exact build version.
      - build/$BOARD/idf*/project_description.json
      - build/$BOARD/idf*/release-build-identity.json

# Qualified board/IDF pairs: P4/S3 use pinned v5.5.6; S31 requires v6.1.
firmware:
  extends: .firmware_base
  parallel:
    matrix:
      - IDF_IMAGE: ["v5.5.6"]
        BOARD:
          - ESP32_P4X_EYE
          - ESP32_P4X_FUNCTION_EV_BOARD
          - ESP32_P4X_VISION
          - ESP32_S3_EYE
          - AtomS3R-M12
          - TEMPLATE
      - IDF_IMAGE: ["release-v6.1"]
        BOARD:
          - ESP32_S31_CHATBOT
          - ESP32_S31_KORVO
          - ESP32_S31_MOSAICO
