<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1066" viewBox="0 0 960 1066" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">ESP-VISION system architecture</title>
  <desc id="architecture-description">IDE, Agent, CLI and custom host applications share Device Core. EV-MUX v4 connects the host SDK to ESP-VISION firmware over USB CDC, USB Serial/JTAG, UART or TCP. Device firmware includes MicroPython scripts, Python bindings, vision and inference libraries, runtime, platform services and board backends.</desc>
