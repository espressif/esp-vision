<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1232" viewBox="0 0 960 1232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="architecture-title architecture-description">
  <title id="architecture-title">ESP-VISION system architecture</title>
  <desc id="architecture-description">IDE and custom SDK applications use Device Core directly. AI clients and independent agents use the ESP-VISION plugin Skill, its bundled Device CLI for local device operations, and the official online Knowledge MCP over HTTPS. Device CLI calls Device Core; EV-MUX v4 connects the SDK to firmware over USB CDC, USB Serial/JTAG, UART or TCP. Knowledge MCP provides APIs, documentation and examples from a versioned snapshot. Firmware contains MicroPython scripts, bindings, vision and inference libraries, platform services and board backends.</desc>
