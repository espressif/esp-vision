name: Website
description: Website pages, documentation, downloads, links, or MCP knowledge
title: '[Website] '
body:
- type: markdown
  attributes:
    value: |-
      Report this category here in espressif/esp-vision, including issues in companion repositories. Search existing issues first. Remove credentials and private data from attachments.
- type: textarea
  id: summary
  attributes:
    label: Problem summary
    description: Describe the affected feature and impact.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Fill in the relevant versions; write unknown or not applicable where needed.
    placeholder: |
      Affected page URL or MCP tool/resource:
      Page language and documentation version/target:
      OS and version:
      Browser and version (or MCP client/version):
      Time of failure and timezone:
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Provide the smallest reproducible example and prerequisites.
    placeholder: |
      1. Open the URL or query the MCP tool/resource
      2. Click, search, download, or enter a query
      3. Observe the failure
      Reproduction frequency:
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: What should happen?
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: What happened, including the exact error message?
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs and attachments
    description: Screenshot, broken link, HTTP status, or minimal MCP query/response; identify incorrect text and its source
  validations:
    required: false
- type: textarea
  id: workaround
  attributes:
    label: Workaround and regression
    description: If known, include a workaround, last working version, and first failing version.
  validations:
    required: false
