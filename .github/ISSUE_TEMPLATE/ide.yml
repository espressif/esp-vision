name: IDE
description: IDE UI, editor, projects, preview, or flashing workflows
title: '[IDE] '
body:
- type: markdown
  attributes:
    value: |-
      Report this category here in espressif/esp-vision, including issues in companion repositories. Search existing issues first. Remove credentials and private data from attachments.
- type: textarea
  id: summary
  attributes:
    label: Problem summary
    description: Describe the affected feature and impact.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Fill in the relevant versions; write unknown or not applicable where needed.
    placeholder: |
      IDE type and URL:
      IDE version or commit:
      OS and version:
      Browser or VS Code version:
      Board and firmware version (if involved):
      Connection (usb/usj/uart/tcp, if involved):
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Provide the smallest reproducible example and prerequisites.
    placeholder: |
      1. Open the IDE and project
      2. Perform the action
      3. Observe the failure
      Reproduction frequency:
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
    description: What should happen?
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: What happened, including the exact error message?
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs and attachments
    description: Browser developer console or VS Code output, screenshots, and a minimal project or script
  validations:
    required: false
- type: textarea
  id: workaround
  attributes:
    label: Workaround and regression
    description: If known, include a workaround, last working version, and first failing version.
  validations:
    required: false
